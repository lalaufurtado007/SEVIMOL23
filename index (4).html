<body>
<div class="wrap">
  <h1>🍀 Bolão Sevimol</h1>
  <div class="sub">Escolha 15 números de 1 a 60. Cada pessoa pode enviar até 10 jogos.</div>
  <div class="aviso" id="configAviso" style="display:none;">
    Configure SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo index.html antes de usar.
  </div>

  <div class="stats">
    <div class="stat"><b id="totalJogos">0</b>jogos</div>
    <div class="stat"><b id="totalPessoas">0</b>pessoas</div>
  </div>

  <div class="card">
    <label for="nome">Seu nome</label>
    <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name">
    <label>Escolha 15 números (1 a 60)</label>
    <div class="grid" id="grid"></div>
    <div class="count" id="count">0 / 15 selecionados</div>
    <div class="limite" id="limite">Você já enviou 10 jogos — limite atingido.</div>
    <button class="primary" id="enviar" disabled>Enviar jogo</button>
  </div>

  <button class="secondary" id="baixarCsv">⬇️ Baixar planilha (CSV)</button>

  <div id="lista"></div>
</div>

<script>
// ====== CONFIGURAÇÃO: preencha com os dados do seu projeto Supabase ======
const SUPABASE_URL =https://vqqhlgfnmagmtkhbmdnq.supabase.co;
const SUPABASE_ANON_KEY =eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJp;
// Acesso ao modo de remoção (opcional): abra o site como
//   seusite.vercel.app/?admin=SENHA_ESCOLHIDA
const ADMIN_PASSWORD =lalau123;
// ===========================================================================

const MAX_NUM = 60;
const NUMS_POR_JOGO = 15;
const MAX_JOGOS_POR_PESSOA = 10;
const POLL_MS = 8000;

let supa = null;
let selected = new Set();
let jogosPorNomeAtual = {};
let ultimosDocs = [];

const isAdmin = new URLSearchParams(location.search).get('admin') === ADMIN_PASSWORD;

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const limiteEl = document.getElementById('limite');
const enviarBtn = document.getElementById('enviar');
const nomeInput = document.getElementById('nome');
const lista = document.getElementById('lista');
const totalJogosEl = document.getElementById('totalJogos');
const totalPessoasEl = document.getElementById('totalPessoas');
const configAviso = document.getElementById('configAviso');
const baixarCsvBtn = document.getElementById('baixarCsv');

if(SUPABASE_URL.startsWith('COLOQUE_AQUI') || SUPABASE_ANON_KEY.startsWith('COLOQUE_AQUI')){
  configAviso.style.display = 'block';
} else {
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

for(let i=1;i<=MAX_NUM;i++){
  const d = document.createElement('div');
  d.className='num';
  d.textContent=i;
  d.dataset.n=i;
  d.addEventListener('click',()=>{
    if(atingiuLimite()) return;
    if(selected.has(i)) selected.delete(i);
    else if(selected.size<NUMS_POR_JOGO) selected.add(i);
    render();
  });
  grid.appendChild(d);
}

function atingiuLimite(){
  const nome = nomeInput.value.trim().toLowerCase();
  if(!nome) return false;
  return (jogosPorNomeAtual[nome]||0) >= MAX_JOGOS_POR_PESSOA;
}

function render(){
  const limite = atingiuLimite();
  [...grid.children].forEach(el=>{
    const n = Number(el.dataset.n);
    el.classList.toggle('on', selected.has(n));
    el.classList.toggle('disabled', limite);
  });
  countEl.textContent = selected.size + ' / ' + NUMS_POR_JOGO + ' selecionados';
  countEl.classList.toggle('ok', selected.size===NUMS_POR_JOGO);
  limiteEl.classList.toggle('show', limite);
  enviarBtn.disabled = limite || selected.size!==NUMS_POR_JOGO || !nomeInput.value.trim();
}
nomeInput.addEventListener('input', render);

enviarBtn.addEventListener('click', async ()=>{
  if(!supa) return;
  const nome = nomeInput.value.trim();
  if(!nome || selected.size!==NUMS_POR_JOGO || atingiuLimite()) return;
  enviarBtn.disabled = true;
  enviarBtn.textContent = 'Enviando...';
  const { error } = await supa.from('jogos').insert({
    nome,
    numeros: [...selected].sort((a,b)=>a-b)
  });
  if(error){
    console.error(error);
    alert('Não foi possível salvar o jogo. Tente novamente.');
  } else {
    selected.clear();
  }
  render();
  enviarBtn.textContent = 'Enviar jogo';
  carregarJogos();
});

baixarCsvBtn.addEventListener('click', ()=>{
  if(ultimosDocs.length===0){ alert('Ainda não há jogos para exportar.'); return; }
  const linhas = [['nome','jogo_numero','numeros','criado_em']];
  const porPessoa = {};
  ultimosDocs.forEach(j=>{
    porPessoa[j.nome] = porPessoa[j.nome] || [];
    porPessoa[j.nome].push(j);
  });
  Object.keys(porPessoa).sort().forEach(nome=>{
    porPessoa[nome].forEach((j,idx)=>{
      linhas.push([nome, idx+1, j.numeros.join(' '), j.criado_em]);
    });
  });
  const csv = linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bolao-sevimol-jogos.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function renderLista(docs){
  ultimosDocs = docs;
  totalJogosEl.textContent = docs.length;
  const porPessoa = {};
  docs.forEach(j=>{
    if(!porPessoa[j.nome]) porPessoa[j.nome] = [];
    porPessoa[j.nome].push(j);
  });
  totalPessoasEl.textContent = Object.keys(porPessoa).length;

  jogosPorNomeAtual = {};
  Object.keys(porPessoa).forEach(nome=>{
    jogosPorNomeAtual[nome.toLowerCase()] = porPessoa[nome].length;
  });
  render();

  if(docs.length===0){
    lista.innerHTML = '<div class="empty">Nenhum jogo enviado ainda.</div>';
    return;
  }

  lista.innerHTML='';
  Object.keys(porPessoa).sort().forEach(nome=>{
    const titulo = document.createElement('div');
    titulo.className='grupo-titulo';
    titulo.textContent = nome + ' · ' + porPessoa[nome].length + '/' + MAX_JOGOS_POR_PESSOA + ' jogo(s)';
    lista.appendChild(titulo);
    porPessoa[nome].forEach((jogo,idx)=>{
      const div = document.createElement('div');
      div.className='jogo';
      const nums = jogo.numeros.map(n=>'<span class="pill">'+n+'</span>').join('');
      div.innerHTML = '<div class="jogo-head"><span class="jogo-nome">Jogo '+(idx+1)+'</span>' +
        (isAdmin ? '<button class="del" data-id="'+jogo.id+'">remover</button>' : '') +
        '</div><div class="jogo-nums">'+nums+'</div>';
      lista.appendChild(div);
    });
  });

  if(isAdmin){
    lista.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await supa.from('jogos').delete().eq('id', btn.dataset.id);
        carregarJogos();
      });
    });
  }
}

async function carregarJogos(){
  if(!supa) return;
  const { data, error } = await supa.from('jogos').select('*').order('criado_em', { ascending: true });
  if(error){
    console.error(error);
    lista.innerHTML = '<div class="empty">Erro ao carregar os jogos.</div>';
    return;
  }
  renderLista(data);
}

if(supa){
  carregarJogos();
  setInterval(carregarJogos, POLL_MS);
}
</script>
</body>
